schema_version: 2
lesson_id: DE-L001
title: From a vague request to a testable contract
status: ready-for-owner-review
authoring_mode: handcrafted
editorial:
  standard: lesson-authoring-v1
  humanizer: blader/humanizer@3.1.0
  status: pass
lifecycle_profile: learning
risk_tier: R2-standard
target_level: Foundation
central_question: Làm sao biến yêu cầu kỹ thuật mơ hồ thành behavior và acceptance evidence có thể tái hiện?
objective: Viết testable contract khóa boundary, semantics, invariant, failure behavior và evidence trước mutation.
prerequisites:
  - Đọc được pseudocode, bảng dữ liệu và command line cơ bản; chưa giả định kinh nghiệm production.
learner_memory:
  resolved: false
  assumption: No prior mastery claimed; teach and assess the named prerequisites.
scenes:
  - id: S01
    type: explain
    claim: Yêu cầu mơ hồ không tạo được oracle hay expected result duy nhất.
    source_span: "note.md: heading 'Yêu cầu mơ hồ không có oracle'"
    misconception_displaced: Có thể bắt đầu code rồi để implementation tự quyết semantics.
  - id: S02
    type: explain
    claim: Contract testable khóa sáu lớp gồm decision, boundary, semantics, invariants, failure behavior và evidence.
    source_span: "note.md: heading 'Contract kiểm thử được khóa sáu lớp nghĩa'"
    misconception_displaced: Acceptance criterion chỉ cần mô tả happy-path output.
  - id: S03
    type: check
    question: Vì sao câu không được trùng order chưa test được?
    answer: Chưa khóa identity, state, boundary, time và phép đếm nên nhiều expected result đều có thể hợp lý.
    wrong_answer_reveals: Người học nhầm từ khóa chất lượng với một invariant đo được.
    source_span: "note.md: heading 'Identity, time và state quyết định thế nào là đúng'"
  - id: S04
    type: practice
    task: Dùng Example Mapping để đổi sáu yêu cầu mơ hồ thành rule, example, question và Given When Then.
    success_condition: Mỗi scenario có fixture, expected result duy nhất, failure path, oracle và requirement ID.
    source_span: "UNSOURCED: guided practice synthesized from the lesson objective and source-backed mechanism"
  - id: S05
    type: explain
    claim: Timeout tạo unknown outcome; retry an toàn cần idempotency key, conflict semantics và status lookup.
    source_span: "note.md: heading 'Timeout tạo trạng thái unknown, retry tạo side effect'"
    misconception_displaced: Timeout đồng nghĩa server chưa commit nên có thể retry bằng request mới.
  - id: S06
    type: decide
    situation: Freshness SLO đổi từ 10 phút xuống 30 giây trong khi source chỉ cho poll mỗi 2 phút.
    trade_off: Không thể tuning để vượt hard source constraint; cần renegotiate SLO hoặc đổi contract/architecture.
    defensible_choices: Nêu hard constraint, affected consumer, chosen option, rejected alternative và reversal trigger.
    source_span: "UNSOURCED: changed-constraint decision scenario synthesized for transfer"
  - id: S07
    type: explain
    claim: Fixture orders chứng minh identity, out-of-order state, quarantine và idempotent retry bằng nhiều oracle độc lập.
    source_span: "note.md: heading 'Case xuyên chương: đồng bộ orders từ API vào warehouse'"
    misconception_displaced: Uniqueness query đơn lẻ đủ chứng minh end-to-end completeness.
  - id: S08
    type: apply
    task: Thiết kế contract cho API trả 202 rồi client timeout, phân biệt accepted, running và completed.
    assumes: [S01, S02, S04, S05, S06, S07]
    success_condition: Artifact có status model, idempotency scope, evidence, recovery và condition làm quyết định đảo.
    source_span: "UNSOURCED: curriculum transfer scenario synthesized from the lesson contract"
  - id: S09
    type: check
    question: Contract khác implementation plan ở đâu?
    answer: Contract khóa behavior và evidence phải chứng minh; implementation plan chọn cơ chế để đạt behavior đó.
    wrong_answer_reveals: Người học khóa công nghệ quá sớm hoặc cho rằng contract thay thế test và vận hành.
    source_span: "note.md: heading 'Contract không thay thế thiết kế, test hay vận hành'"
assessment:
  formative: "quiz.md: 10 câu; đạt từ 8/10 và sửa đúng concept đã sai."
  authentic: "homework.md: artifact theo rubric 100 điểm; đạt từ 75 và không có critical failure."
  mastery_claim: None. Package readiness and learner mastery are separate evidence states.
publish:
  note: true
  teaching: true
  slides: true
  quiz: true
  homework: true
  after_note: true
  answer_key: true
unused_source_spans:
  - SLO arithmetic and traceability table remain available for extension and remediation.
