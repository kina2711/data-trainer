schema_version: 2
lesson_id: DA-L001
title: What a Data Analyst actually does all day
status: ready-for-owner-review
authoring_mode: handcrafted
editorial:
  standard: lesson-authoring-v1
  humanizer: blader/humanizer@3.1.0
  status: pass
lifecycle_profile: learning
risk_tier: R2-standard
target_level: Foundation
central_question: Data Analyst tạo giá trị ở đâu trong vòng đời từ yêu cầu đến quyết định?
objective: Chuyển yêu cầu mơ hồ thành kết luận có kiểm chứng, phân ranh giới vai trò bằng artifact và đưa ra hành động có owner.
prerequisites:
  - Không yêu cầu kỹ thuật; người học mang theo một ví dụ về quyết định từng gặp.
learner_memory:
  resolved: false
  assumption: No prior mastery claimed; teach and assess the named prerequisites.
scenes:
  - id: S01
    type: explain
    claim: Giá trị bắt đầu từ quyết định cần hỗ trợ, không bắt đầu từ dashboard.
    source_span: "note.md: heading 'Giá trị bắt đầu từ quyết định, không bắt đầu từ dashboard'"
    misconception_displaced: Output đẹp đồng nghĩa với phân tích hữu ích.
  - id: S02
    type: explain
    claim: Ask, Prepare, Process, Analyze, Share và Act là vòng phản hồi có kiểm soát.
    source_span: "note.md: heading 'Sáu pha tạo thành một vòng kiểm soát'"
    misconception_displaced: Sáu pha là checklist tuyến tính chỉ đi qua một lần.
  - id: S03
    type: check
    question: Vì sao phát hiện thiếu dữ liệu ở Process có thể buộc quay lại Prepare?
    answer: Vì source, cutoff hoặc coverage ban đầu chưa đủ; tiếp tục analyze sẽ biến lỗi dữ liệu thành câu chuyện kinh doanh.
    wrong_answer_reveals: Người học coi quy trình là tuyến tính hoặc chưa phân biệt data incident với business change.
    source_span: "note.md: heading 'Sáu pha tạo thành một vòng kiểm soát'"
  - id: S04
    type: practice
    task: Phân loại tám thẻ việc theo consumer, decision, role, artifact, critical failure và handoff.
    success_condition: Đúng ít nhất 6/8, mọi lý do dùng outcome hoặc artifact; không dùng tên công cụ làm tiêu chí chính.
    source_span: "UNSOURCED: guided practice synthesized from the lesson objective and source-backed mechanism"
  - id: S05
    type: explain
    claim: Ranh giới vai trò nằm ở trách nhiệm và failure phải bảo vệ, không nằm ở SQL, Python hay dashboard.
    source_span: "note.md: heading 'Ranh giới vai trò nằm ở thứ phải chịu trách nhiệm'"
    misconception_displaced: Một công cụ chỉ thuộc về một vai trò.
  - id: S06
    type: decide
    situation: Công ty chỉ có một người dữ liệu nhưng yêu cầu bao gồm ingestion, metric, dashboard, analysis và forecast.
    trade_off: Một người có thể đội nhiều mũ, nhưng tiêu chí hoàn thành và handoff của từng mũ vẫn phải tách rõ.
    defensible_choices: Nêu ưu tiên, rủi ro chấp nhận, owner, alternative bị loại và reversal trigger.
    source_span: "UNSOURCED: changed-constraint decision scenario synthesized for transfer"
  - id: S07
    type: explain
    claim: Reconciliation biến mức giảm dashboard 12% thành mức giảm 4%, sau đó decomposition chỉ ra chênh lệch tập trung ở khách mới mà chưa khẳng định nguyên nhân.
    source_span: "note.md: heading 'Một con số chỉ có giá trị khi giữ được chuỗi lập luận'"
    misconception_displaced: Segment có chênh lệch lớn nhất tự động là nguyên nhân.
  - id: S08
    type: apply
    task: Viết decision memo cho case doanh thu, gồm claim, evidence, uncertainty, action, owner, deadline và reversal trigger.
    assumes: [S01, S02, S04, S05, S06, S07]
    success_condition: Memo tách data incident khỏi business action, không vượt quá strength của evidence.
    source_span: "UNSOURCED: curriculum transfer scenario synthesized from the lesson contract"
  - id: S09
    type: check
    question: Data Analyst khác Data Engineer ở đâu khi cả hai cùng điều tra dữ liệu thiếu?
    answer: DA bảo vệ fitness-for-decision và conclusion; DE bảo vệ ingestion, delivery và recovery. Họ phối hợp trên evidence nhưng sở hữu failure khác nhau.
    wrong_answer_reveals: Người học vẫn phân vai bằng công cụ hoặc chức danh thay vì invariant và artifact.
    source_span: "note.md: heading 'Những ngộ nhận làm analyst tạo output nhưng không tạo giá trị'"
assessment:
  formative: "quiz.md: 10 câu; đạt từ 8/10 và sửa đúng concept đã sai."
  authentic: "homework.md: artifact theo rubric 100 điểm; đạt từ 75 và không có critical failure."
  mastery_claim: None. Package readiness and learner mastery are separate evidence states.
publish:
  note: true
  teaching: true
  slides: true
  quiz: true
  homework: true
  after_note: true
  answer_key: true
unused_source_spans:
  - Responsible data use and organizational-context sections remain available for extension and remediation.
