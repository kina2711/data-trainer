success_criteria:
  - Define observability as an inferential system property and distinguish it from a tool inventory or known-failure monitoring.
  - Explain trace, root span, child span, trace ID propagation, causal structure, missing spans, and cross-boundary correlation without relying on obsolete OpenTelemetry APIs.
  - Separate packet, transport, telemetry, application, and business evidence and state what each can and cannot prove.
  - Decompose client-observed request time into DNS, connection or TLS, proxy or queue, application, downstream, and response-transfer stages with explicit measurement boundaries.
  - Explain metrics as time series, distribution and cardinality tradeoffs; reject average-only diagnosis and unbounded labels.
  - Explain structured logging, correlation fields, clock limitations, sensitive-data controls, and logging resource cost.
  - Provide a reproducible hypothesis ledger, evidence matrix, baseline-versus-fault comparison, recovery verification, and three-layer diagnostic scenarios for DE-L088.
  - Preserve source qualifiers, mark synthesis, inference and uncertainty, and complete a Vietnamese Humanizer pass.
  - Keep Reference, staging Wiki, and canonical Obsidian copies byte-identical.
validation:
  - All three source hashes match registered records.
  - All 30 PDF pages in declared scope contain extractable text.
  - Frontmatter, IDs, claim types, locators, links, manifest counts, required terms, and Markdown fences validate.
  - Retrieval tests cover observability, trace/span relationships, evidence boundaries, latency decomposition, percentile diagnosis, structured logs, missing telemetry, and DE-L088 proof requirements.
