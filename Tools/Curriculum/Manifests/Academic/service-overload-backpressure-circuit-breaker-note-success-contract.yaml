success_criteria:
  - Explain the positive-feedback path from queue growth to latency, timeout, retry amplification, capacity loss, and metastable overload.
  - Distinguish TCP flow control, application backpressure, admission control or throttling, load shedding, concurrency limiting, and circuit breaking by signal, protected resource, and action.
  - Explain token-bucket capacity and refill semantics without turning the illustrative source code into production guidance.
  - Explain circuit-breaker closed and open behavior, failure classification, recovery probing, fallback limits, and the difference from rate limiting.
  - Define bounded queues, deadlines, retry budgets, exponential backoff with jitter, and idempotency preconditions as one coordinated overload policy.
  - Provide a controlled-overload experiment for DE-L087 proving that priority work remains served and doomed downstream calls stop.
  - Preserve source qualifiers, mark synthesis and uncertainty, and complete a Vietnamese Humanizer pass.
  - Register new sources with hashes, rights, authority, extraction limits, and stable source IDs.
  - Keep Reference, staging Wiki, and canonical Obsidian copies byte-identical.
validation:
  - All three source hashes match the files read.
  - All 24 PDF pages in declared scope contain extractable text.
  - Frontmatter, IDs, claim types, locators, links, manifest counts, required terms, and Markdown fences validate.
  - Retrieval tests cover feedback overload, backpressure versus throttling, load shedding, token buckets, circuit breakers, retry storms, and priority degradation.
