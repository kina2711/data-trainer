limits:
  - The two repositories are teaching models rather than executable source trees; their file counts are model counts.
  - No AST parser, strongly connected component detector, or database-replacement test was run on a real repository.
  - Newman's service-level coupling taxonomy is applied to in-process modules as a marked synthesis.
  - The instability formula is provisional because it has no locator in the three bounded source scopes.
  - Co-change was not measured on a repository with real commit history.
  - Dynamic imports, reflection, dependency-injection configuration, and runtime plugins were not analyzed.
  - No universal thresholds are asserted for fan-in, fan-out, cycles, or changed-file counts.
