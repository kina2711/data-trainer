<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Rabbit Data learning portal: roadmap, Second Brain và bài giảng đã hoàn thiện.">
  <title>Rabbit Data</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header class="topbar">
      <button id="nav-toggle" class="icon-button nav-toggle" type="button" aria-label="Mở danh mục">☰</button>
      <a id="brand-home" class="brand" href="#" aria-label="Rabbit Data home">
        <span class="brand-mark" aria-hidden="true">RD</span>
        <span><strong>Rabbit Data</strong><small id="release-label">đang nạp…</small></span>
      </a>
      <nav class="space-nav" aria-label="Khu vực nội dung">
        <button class="space-button active" data-space="roadmap" type="button"><span aria-hidden="true">◇</span> Roadmap</button>
        <button class="space-button" data-space="brain" type="button"><span aria-hidden="true">◎</span> Second Brain</button>
        <button class="space-button" data-space="lessons" type="button"><span aria-hidden="true">▤</span> Bài giảng</button>
      </nav>
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" autocomplete="off" placeholder="Tìm trong Roadmap…" aria-label="Tìm kiếm nội dung">
        <kbd>Ctrl K</kbd>
      </label>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="Đổi giao diện sáng tối">◐</button>
    </header>

    <aside id="sidebar" class="sidebar" aria-label="Bộ lọc và danh sách nội dung">
      <div class="sidebar-heading">
        <p id="sidebar-kicker">LỘ TRÌNH</p>
        <h2 id="sidebar-title">Roadmap chương trình</h2>
      </div>
      <div id="program-switch" class="program-switch" role="group" aria-label="Chương trình">
        <button class="program-button active" data-program="" type="button">Tất cả</button>
        <button class="program-button" data-program="DA" type="button">DA</button>
        <button class="program-button" data-program="DE" type="button">DE</button>
      </div>
      <label id="filter-label" class="filter-label" for="content-filter">Cấp roadmap</label>
      <select id="content-filter"></select>
      <div id="brain-modes" class="sidebar-tabs" role="tablist" aria-label="Chế độ Second Brain" hidden>
        <button class="tab active" data-list-mode="all" role="tab" type="button">Tất cả</button>
        <button class="tab" data-list-mode="favorites" role="tab" type="button">Đã lưu</button>
        <button class="tab" data-list-mode="recent" role="tab" type="button">Gần đây</button>
      </div>
      <div class="result-summary"><span id="result-count">0 mục</span><button id="clear-filters" type="button">Xóa lọc</button></div>
      <div id="content-list" class="content-list" role="listbox" aria-label="Danh sách nội dung"></div>
    </aside>

    <main class="reader-shell">
      <section id="empty-state" class="empty-state">
        <div class="empty-orbit" aria-hidden="true"><span></span><span></span><span></span></div>
        <p id="home-kicker" class="home-kicker">RABBIT DATA LEARNING OS</p>
        <h1 id="home-title">Bắt đầu từ lộ trình</h1>
        <p id="home-description">Xem bức tranh năng lực từ chương trình đến từng mô-đun, rồi đi vào bài giảng đã sẵn sàng.</p>
        <div id="portal-stats" class="stats"></div>
      </section>

      <article id="reader" class="reader" hidden>
        <header class="content-header">
          <div>
            <div class="eyebrow"><span id="content-domain"></span><span id="content-status" class="status-badge"></span></div>
            <h1 id="content-title"></h1>
            <p id="content-question" class="content-question"></p>
          </div>
          <button id="favorite-button" class="favorite-button" type="button" aria-label="Lưu note" hidden>☆</button>
        </header>
        <div id="content-meta" class="content-meta"></div>
        <nav id="asset-tabs" class="asset-tabs" aria-label="Thành phần bài giảng" hidden></nav>
        <div id="content-body" class="prose"></div>
      </article>
    </main>

    <aside id="context-panel" class="context-panel" aria-label="Mục lục và quan hệ" hidden>
      <section><h2>Trong nội dung</h2><nav id="outline"></nav></section>
      <section id="connections-section"><h2 id="connections-title">Liên kết</h2><div id="connections"></div></section>
      <section id="sources-section"><h2>Nguồn / đường dẫn</h2><div id="sources"></div></section>
    </aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
